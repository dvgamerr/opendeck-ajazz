<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<script>
			let update = () => {};

			function connectElgatoStreamDeckSocket(inPort, inPropertyInspectorUUID, inRegisterEvent, inInfo, inActionInfo) {
				inActionInfo = JSON.parse(inActionInfo);

				if (inActionInfo.payload.controller == "Encoder") {
					document.body.replaceChildren();
					return;
				}

				const websocket = new WebSocket("ws://localhost:" + inPort);
				websocket.onopen = () => {
					websocket.send(
						JSON.stringify({
							event: inRegisterEvent,
							uuid: inPropertyInspectorUUID,
						}),
					);
				};

				const action = document.getElementById("action");
				action.value = inActionInfo.payload.settings.action ?? "set";
				const value = document.getElementById("value");
				value.value = (inActionInfo.payload.settings.value ?? 50).toString();
				const valueDisplay = document.getElementById("value-display");
				valueDisplay.innerText = value.value + "%";

				update = () => {
					valueDisplay.innerText = value.value + "%";
					websocket.send(
						JSON.stringify({
							event: "setSettings",
							context: inActionInfo.context,
							payload: {
								action: action.value,
								value: parseInt(value.value),
							},
						}),
					);
				};
			}
		</script>
	</head>
	<body class="inspector-page bg-base-200 text-base-content">
		<section class="inspector-panel card bg-base-100">
			<div class="card-body">
				<header class="inspector-header">
					<h1 class="card-title">Device Brightness</h1>
					<span class="badge badge-neutral">Action options</span>
				</header>
				<fieldset class="fieldset">
					<legend class="fieldset-legend">Action</legend>
					<select id="action" onchange="update()" class="select select-bordered">
						<option value="set">Set</option>
						<option value="increase">Increase</option>
						<option value="decrease">Decrease</option>
					</select>
				</fieldset>
				<fieldset class="fieldset">
					<legend class="fieldset-legend">Value <span id="value-display" class="badge badge-primary"></span></legend>
					<input id="value" oninput="update()" class="range range-primary" type="range" min="0" max="100" />
				</fieldset>
			</div>
		</section>
	</body>
</html>
