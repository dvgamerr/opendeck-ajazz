<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<script>
			let update = () => {};

			function connectElgatoStreamDeckSocket(inPort, inPropertyInspectorUUID, inRegisterEvent, inInfo, inActionInfo) {
				const websocket = new WebSocket("ws://localhost:" + inPort);
				inActionInfo = JSON.parse(inActionInfo);
				websocket.onopen = () => {
					websocket.send(
						JSON.stringify({
							event: inRegisterEvent,
							uuid: inPropertyInspectorUUID,
						}),
					);
				};

				if (inActionInfo.payload.controller == "Encoder") {
					document.getElementById("encoder").hidden = false;
					document.getElementById("down-label").innerText = "Dial down";
					document.getElementById("up-label").innerText = "Dial up";
				}

				const down = document.getElementById("down");
				down.value = inActionInfo.payload.settings.down ?? "";
				const up = document.getElementById("up");
				up.value = inActionInfo.payload.settings.up ?? "";
				const rotate = document.getElementById("rotate");
				rotate.value = inActionInfo.payload.settings.rotate ?? "";
				const file = document.getElementById("file");
				file.value = inActionInfo.payload.settings.file ?? "";
				const show = document.getElementById("show");
				show.checked = inActionInfo.payload.settings.show ?? false;

				update = () => {
					websocket.send(
						JSON.stringify({
							event: "setSettings",
							context: inActionInfo.context,
							payload: {
								down: down.value,
								up: up.value,
								rotate: rotate.value,
								file: file.value,
								show: show.checked,
							},
						}),
					);
				};
			}
		</script>
	</head>
	<body class="inspector-page bg-base-200 text-base-content">
		<section class="inspector-panel card bg-base-100">
			<div class="card-body">
				<header class="inspector-header">
					<h1 class="card-title">Run Command</h1>
					<span class="badge badge-neutral">Action options</span>
				</header>
				<fieldset class="fieldset">
					<legend class="fieldset-legend" id="down-label">Key down</legend>
					<input id="down" oninput="update()" class="input input-bordered" />
				</fieldset>
				<fieldset class="fieldset">
					<legend class="fieldset-legend" id="up-label">Key up</legend>
					<input id="up" oninput="update()" class="input input-bordered" />
				</fieldset>
				<div id="encoder" hidden>
					<fieldset class="fieldset">
						<legend class="fieldset-legend">Dial rotate</legend>
						<input id="rotate" oninput="update()" class="input input-bordered" />
					</fieldset>
					<div role="alert" class="alert">
						<span><code>%d</code> is replaced by the number of ticks turned; negative values are counterclockwise and positive values are clockwise.</span>
					</div>
				</div>
				<fieldset class="fieldset">
					<legend class="fieldset-legend">Write to path</legend>
					<input id="file" oninput="update()" class="input input-bordered" />
				</fieldset>
				<label class="label">
					<span>Show on key</span>
					<input id="show" type="checkbox" oninput="update()" class="toggle toggle-primary" />
				</label>
			</div>
		</section>
	</body>
</html>
