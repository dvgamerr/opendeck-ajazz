<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<script>
			let save = () => {};

			function connectElgatoStreamDeckSocket(port, uuid, registerEvent, info, actionInfo) {
				const socket = new WebSocket("ws://localhost:" + port);
				const action = JSON.parse(actionInfo);
				const step = document.getElementById("step");
				const output = document.getElementById("step-output");
				step.value = action.payload.settings.step ?? 2;
				output.textContent = step.value + "%";
				socket.onopen = () => socket.send(JSON.stringify({ event: registerEvent, uuid }));
				save = () =>
					socket.send(
						JSON.stringify({
							event: "setSettings",
							context: action.context,
							payload: { step: Number(step.value) },
						}),
					);
			}
		</script>
	</head>
	<body class="bg-base-200 text-base-content">
		<section class="card bg-base-100">
			<div class="card-body">
				<header>
					<h1 class="card-title">Volume + Sound Device</h1>
					<span class="badge badge-neutral">Encoder options</span>
				</header>
				<div class="stats">
					<div class="stat">
						<div class="stat-title">Volume</div>
						<div class="stat-value">↻</div>
					</div>
					<div class="stat">
						<div class="stat-title">Next</div>
						<div class="stat-value">1X</div>
					</div>
					<div class="stat">
						<div class="stat-title">Previous</div>
						<div class="stat-value">2X</div>
					</div>
				</div>
				<fieldset class="fieldset">
					<legend class="fieldset-legend">Step <output id="step-output" class="badge badge-primary"></output></legend>
					<input id="step" class="range range-primary" type="range" min="1" max="20" oninput="document.getElementById('step-output').textContent = value + '%'" onchange="save()" />
				</fieldset>
				<div role="alert" class="alert">
					<span>Adjust the amount changed by each dial step.</span>
				</div>
			</div>
		</section>
	</body>
</html>
