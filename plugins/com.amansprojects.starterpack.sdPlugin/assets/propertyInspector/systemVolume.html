<!DOCTYPE html>
<html lang="en">
	<head>
		<script>
			let save = () => {};

			function connectElgatoStreamDeckSocket(port, uuid, registerEvent, info, actionInfo) {
				const socket = new WebSocket("ws://localhost:" + port);
				const action = JSON.parse(actionInfo);
				const step = document.getElementById("step");
				const output = document.getElementById("step-output");
				step.value = action.payload.settings.step ?? 2;
				output.textContent = step.value + "%";
				socket.onopen = () => socket.send(JSON.stringify({ event: registerEvent, uuid }));
				save = () => socket.send(JSON.stringify({
					event: "setSettings",
					context: action.context,
					payload: { step: Number(step.value) },
				}));
			}
		</script>
		<link rel="stylesheet" href="sdpi.css" />
		<link rel="stylesheet" href="pixel-settings.css" />
	</head>
	<body>
		<header class="pixel-header">
			<span>VOL + DEVICE</span>
			<small>ENCODER CONTROL</small>
		</header>
		<div class="gesture-grid">
			<div><b>↻</b><span>VOLUME</span></div>
			<div><b>1X</b><span>NEXT</span></div>
			<div><b>2X</b><span>PREVIOUS</span></div>
		</div>
		<div class="sdpi-item">
			<div class="sdpi-item-label">STEP <output id="step-output"></output></div>
			<input id="step" class="sdpi-item-value" type="range" min="1" max="20"
				oninput="document.getElementById('step-output').textContent=value+'%'"
				onchange="save()" />
		</div>
		<p class="pixel-note">LCD // 176×112 // BLACK PIXEL MODE</p>
	</body>
</html>
