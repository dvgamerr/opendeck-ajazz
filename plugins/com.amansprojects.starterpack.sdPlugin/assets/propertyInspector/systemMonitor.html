<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<script>
			let save = () => {};

			function connectElgatoStreamDeckSocket(port, uuid, registerEvent, info, actionInfo) {
				const socket = new WebSocket("ws://localhost:" + port);
				const action = JSON.parse(actionInfo);
				const mode = document.getElementById("mode");
				const metric = document.getElementById("metric");
				const savedMode = action.payload.settings.mode ?? "normal";
				mode.value = savedMode === "mini" ? "compact" : savedMode === "medium" ? "normal" : savedMode;
				metric.value = action.payload.settings.metric ?? "overview";
				socket.onopen = () => socket.send(JSON.stringify({ event: registerEvent, uuid }));
				save = () =>
					socket.send(
						JSON.stringify({
							event: "setSettings",
							context: action.context,
							payload: { mode: mode.value, metric: metric.value },
						}),
					);
			}
		</script>
	</head>
	<body class="inspector-page bg-base-200 text-base-content">
		<section class="inspector-panel card bg-base-100">
			<div class="card-body">
				<header class="inspector-header">
					<h1 class="card-title">System Monitor</h1>
					<span class="badge badge-neutral">Realtime display</span>
				</header>
				<fieldset class="fieldset">
					<legend class="fieldset-legend">Metric</legend>
					<select id="metric" class="select w-full" onchange="save()">
						<option value="overview">Overview — CPU, GPU, and memory</option>
						<option value="cpu">CPU usage</option>
						<option value="gpu">GPU usage</option>
						<option value="memory">Memory usage</option>
						<option value="cpu-temperature">CPU temperature</option>
						<option value="gpu-temperature">GPU temperature</option>
					</select>
				</fieldset>
				<fieldset class="fieldset">
					<legend class="fieldset-legend">Display mode</legend>
					<select id="mode" class="select w-full" onchange="save()">
						<option value="compact">Compact — values only</option>
						<option value="normal">Normal — segmented meters</option>
						<option value="full">Full — details + history graph</option>
					</select>
				</fieldset>
				<div class="inspector-options">
					<div>
						<span><strong>Compact</strong><br />Large value with minimal decoration.</span>
					</div>
					<div>
						<span><strong>Normal</strong><br />Large value with a segmented meter.</span>
					</div>
					<div>
						<span><strong>Full</strong><br />Live value and a 30-second history graph.</span>
					</div>
				</div>
				<div role="alert" class="alert">
					<span>Usage refreshes once per second. Unsupported temperature sensors display --.</span>
				</div>
			</div>
		</section>
	</body>
</html>
