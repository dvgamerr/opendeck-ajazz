<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<script>
			let update = () => {};

			function connectElgatoStreamDeckSocket(inPort, inPropertyInspectorUUID, inRegisterEvent, inInfo, inActionInfo) {
				const websocket = new WebSocket("ws://localhost:" + inPort);
				inActionInfo = JSON.parse(inActionInfo);
				websocket.onopen = () => {
					websocket.send(
						JSON.stringify({
							event: inRegisterEvent,
							uuid: inPropertyInspectorUUID,
						}),
					);
				};

				const device = document.getElementById("device");
				device.value = inActionInfo.payload.settings.device ?? inActionInfo.device;
				const profile = document.getElementById("profile");
				profile.value = inActionInfo.payload.settings.profile ?? "Default";

				update = () => {
					websocket.send(
						JSON.stringify({
							event: "setSettings",
							context: inActionInfo.context,
							payload: {
								device: device.value ?? inActionInfo.device,
								profile: profile.value,
							},
						}),
					);
				};
			}
		</script>
	</head>
	<body class="inspector-page bg-base-200 text-base-content">
		<section class="inspector-panel card bg-base-100">
			<div class="card-body">
				<header class="inspector-header">
					<h1 class="card-title">Switch Profile</h1>
					<span class="badge badge-neutral">Action options</span>
				</header>
				<fieldset class="fieldset">
					<legend class="fieldset-legend">Device ID</legend>
					<input id="device" oninput="update()" class="input input-bordered" />
				</fieldset>
				<fieldset class="fieldset">
					<legend class="fieldset-legend">Profile</legend>
					<input id="profile" oninput="update()" class="input input-bordered" />
				</fieldset>
			</div>
		</section>
	</body>
</html>
