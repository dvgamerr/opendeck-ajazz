---
name: Lint app

on:
  pull_request:
    paths:
      - 'scripts/lint-app.sh'
      - 'src-tauri/**'
      - 'src/**'
    branches:
      - main
    types: ["opened", "synchronize", "reopened"]

permissions:
  contents: read
  packages: read

jobs:
  lint-app:
    name: Lint app
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/mistweaverco/opendeck-ajazz-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: linux-app-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            linux-app-bun-${{ hashFiles('bun.lock') }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Lint app
        run: ./scripts/lint-app.sh
